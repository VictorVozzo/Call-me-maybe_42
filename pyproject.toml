[project]
name = "Call_me_maybe"
version = "0.1.0"
description = "Implementation of Function Calling with an LLM using Constrained Decoding to guarantee 100% valid JSON generation"
readme = "README.md"
authors = [
    { name = "vivozzo-" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk>=0.1.0",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = ["flake8", "mypy"]

[tool.uv]
package = false

[tool.uv.sources]
llm-sdk = { path = "./src/llm_sdk", editable = true }

